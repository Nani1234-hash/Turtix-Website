<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Turtix Digital Solutions</title>

    <link rel="icon" type="image/png" href="logo3.png">

    <style>
        :root {
            --ink: #070b18;
            --paper: #f4f5f7;
            --muted: #a8b0c0;
            --brand: #2e5ce0;
            --brand-light: #6f8fff;
            --line: rgba(255,255,255,0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: var(--ink);
            color: var(--paper);

            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .thank-you {
            width: min(700px, 90%);
            padding: 60px 30px;
        }

        .logo {
            margin-bottom: 45px;
        }

        .logo img {
            width: 55px;
            height: auto;
        }

        h1 {
            font-size: clamp(34px, 5vw, 56px);
            line-height: 1.1;
            margin: 0 0 22px;
            font-weight: 700;
        }

        p {
            max-width: 570px;
            margin: 0 auto 35px;

            color: var(--muted);

            font-size: 17px;
            line-height: 1.7;
        }

        .back-home {
            display: inline-block;

            padding: 13px 25px;

            border: 1px solid var(--line);
            border-radius: 6px;

            color: var(--paper);
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition: 0.25s ease;
        }

        .back-home:hover {
            background: var(--brand);
            border-color: var(--brand);
            color: white;
        }
    </style>
</head>

<body>

    <main class="thank-you">

        <div class="logo">
            <img src="logo3.png" alt="Turtix">
        </div>

        <h1>
            Thank you for getting in touch.
        </h1>

        <p>
            Your message is with us. We’ll review the details and someone
            from our team will be in touch soon.
        </p>

        <a href="index.html" class="back-home">
            Back to Home
        </a>

    </main>

</body>
</html>
