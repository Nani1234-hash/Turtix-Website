<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Turtix</title>

    <link rel="icon" type="image/png" href="logo-icon.png">

    <style>
        :root {
            --ink: #070b18;
            --paper: #f5f5f5;
            --muted: #b5bac5;
            --blue: #3f6fe8;
            --amber: #d99a32;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--ink);
            color: var(--paper);
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thank-you {
            width: 90%;
            max-width: 750px;
            text-align: center;
            padding: 60px 20px;
        }

        .logo img {
            width: 60px;
            margin-bottom: 40px;
        }

        h1 {
            margin: 0 0 25px;
            font-size: 46px;
            line-height: 1.15;
            font-weight: 700;
        }

        p {
            margin: 0 auto 35px;
            max-width: 620px;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.7;
        }

        .back-home {
            display: inline-block;
            padding: 13px 28px;

            background: var(--amber);
            color: #080b14;

            text-decoration: none;
            font-size: 15px;
            font-weight: 600;

            border-radius: 4px;

            transition: 0.25s ease;
        }

        .back-home:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <main class="thank-you">

        <div class="logo">
            <img src="logo-icon.png" alt="Turtix">
        </div>

        <h1>
            Thank you for getting in touch.
        </h1>

        <p>
            Your message is with us. We’ll review the details and
            someone from our team will be in touch soon.
        </p>

        <a href="https://turtix-website.vercel.app/" class="back-home">
            Back to Home
        </a>

    </main>

</body>

</html>
